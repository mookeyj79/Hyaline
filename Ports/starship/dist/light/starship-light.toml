# Hyaline Light for Starship
# Generated from https://github.com/mookeyj79/Hyaline (palette 0.3.1). Do not edit by hand.
#
# Use this file as your whole starship.toml, or copy the "palette" line and
# the [palettes] table into your own config. See Ports/starship/README.md.

"$schema" = 'https://starship.rs/config-schema.json'

# Pick the palette. Palette tables must come after this line.
palette = "Hyaline Light"

# Module styles that need a role other than the Starship default.
# Everything else keeps its default style, recolored by the palette below.

# Modified, staged, and untracked files are a change, not a failure.
[git_status]
style = "bold yellow"

# These modules default to white, which is a background tone in some
# terminal schemes. Point them at readable text roles instead.
[os]
style = "bold text_dim"

[shell]
style = "bold text_dim"

[memory_usage]
style = "bold dimmed text_dim"

# The palette. The eight terminal color names and their bright- versions
# are overridden, so every Starship module that uses them picks up the theme.
# The role names below them are for your own module styles.
[palettes."Hyaline Light"]
black = "#1b2130"
red = "#c04538"
green = "#207e52"
yellow = "#78710a"
blue = "#2973b0"
purple = "#ae47a0"
cyan = "#18788b"
white = "#d3dae3"
bright-black = "#667085"
bright-red = "#c04538"
bright-green = "#207e52"
bright-yellow = "#78710a"
bright-blue = "#2973b0"
bright-purple = "#ae47a0"
bright-cyan = "#18788b"
bright-white = "#f9fafc"
text = "#1b2130"
text_dim = "#465066"
text_muted = "#667085"
accent = "#2973b0"
on_accent = "#ffffff"
magenta = "#ae47a0"
orange = "#a16017"
panel = "#f3f6f9"
raised = "#f9fafc"
line = "#d3dae3"

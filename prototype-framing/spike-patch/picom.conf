# SPIKE. Blur must be in a config file: picom v10 ignored the same flags (research #37).
backend = "xrender";
vsync = false;
use-damage = true;  # false repaints the whole blurred screen every frame and starves Xvfb
shadow = true; shadow-radius = 28; shadow-opacity = 0.45; shadow-offset-x = -28; shadow-offset-y = -18;
fading = false;
blur-background = true;
blur: { method = "gaussian"; size = 21; deviation = 8.0; };

<style>
:root{
  --ui-bg:#f4f6f9; --ui-fg:#1b2130; --ui-dim:#5b6476; --ui-line:#cfd6e0; --ui-pill:#1b2130; --ui-pill-fg:#f4f6f9; --ui-on:#2973b0; --ui-bad:#c04538;
  --mono:"Fira Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ui-bg:#14171c;--ui-fg:#eef1f6;--ui-dim:#9aa3b2;--ui-line:#2c323b;--ui-pill:#eef1f6;--ui-pill-fg:#14171c;--ui-on:#9cc6e8;--ui-bad:#f1afa7;color-scheme:dark}}
:root[data-theme="dark"]{--ui-bg:#14171c;--ui-fg:#eef1f6;--ui-dim:#9aa3b2;--ui-line:#2c323b;--ui-pill:#eef1f6;--ui-pill-fg:#14171c;--ui-on:#9cc6e8;--ui-bad:#f1afa7;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--ui-bg);color:var(--ui-fg);font-family:var(--sans)}
#stage{position:relative;min-height:100%;padding-block:24px 300px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--ui-dim) center/cover no-repeat;box-sizing:border-box}
#wins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:28px;max-width:1240px;margin:0 auto}
.cell{border-radius:14px;padding:0;min-width:0}
.cell.fill{padding:14px}
.cell.fill .wtitle{color:var(--text);text-shadow:none}
.win{display:grid;grid-template-columns:150px minmax(0,1fr);grid-template-rows:auto 1fr auto auto;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25);font-family:var(--mono);font-size:12.5px;line-height:1.55;min-width:0}
.surf{position:relative;min-width:0}
.top{grid-column:1/3;display:flex;align-items:flex-end;gap:2px;padding:8px 10px 0}
.dots{display:flex;gap:6px;margin:0 12px 10px 2px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--text);opacity:.35}
.tab{padding:6px 12px;border-radius:6px 6px 0 0;color:var(--text);white-space:nowrap}
.tab.on{background:var(--panelc)}
.side{grid-row:2/4;padding:10px 0;color:var(--text);border-right:1px solid var(--linec)}
.side div{padding:2px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .sel{background:var(--accent);color:var(--on_accent)}
.side .hd{font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-bottom:6px}
.ed{padding:10px 14px;overflow-x:auto;white-space:pre;color:var(--text)}
.ed .card{display:inline-block;background:var(--raisedc);border:1px solid var(--linec);border-radius:6px;padding:4px 10px;margin-top:6px;font-family:var(--sans);font-size:12px;white-space:normal}
.ed .card b{color:var(--text)} .ed .card span{color:var(--text_dim)}
.term{padding:8px 14px 10px;white-space:pre;overflow-x:auto;color:var(--text);border-top:1px solid var(--linec)}
.status{grid-column:1/3;display:flex;gap:12px;align-items:center;padding:3px 10px;color:var(--text);border-top:1px solid var(--linec);font-size:11.5px}
.status .pill{background:var(--accent);color:var(--on_accent);padding:0 8px;border-radius:4px}
.wtitle{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);margin:0 0 6px 4px}
.c{color:var(--text_muted)}.k{color:var(--magenta)}.s{color:var(--green)}.n{color:var(--orange)}.f{color:var(--blue)}.t{color:var(--cyan)}.p{color:var(--text_dim)}.e{color:var(--red)}.d{color:var(--yellow)}
.wash{background:var(--washc)}.wr{background:var(--washr)}.wg{background:var(--washg)}
.ro{margin-top:8px;background:var(--ui-bg);color:var(--ui-fg);border-radius:8px;padding:8px 10px;font-family:var(--sans);font-size:12px;display:grid;gap:6px}
.ro .row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ro b{font-weight:600;min-width:120px}
.chip{font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:4px;border:1px solid var(--ui-line);font-family:var(--mono);font-size:11px;display:inline-flex;gap:5px;align-items:center}
.chip.bad{border-color:var(--ui-bad);color:var(--ui-bad)}
.sw{width:10px;height:10px;border-radius:2px;border:1px solid var(--ui-line)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(900px,calc(100% - 24px));background:var(--ui-bg);color:var(--ui-fg);border:1px solid var(--ui-line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);padding:10px 12px;display:grid;gap:8px;font-size:13px;z-index:5;box-sizing:border-box;max-height:60vh;overflow:auto}
#bar .r{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#bar .lab{color:var(--ui-dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase;min-width:80px}
#bar button,#bar label.btn{font:inherit;font-size:12.5px;border:1px solid var(--ui-line);background:transparent;color:var(--ui-fg);border-radius:999px;padding:3px 10px;cursor:pointer}
#bar button[aria-pressed="true"]{background:var(--ui-pill);color:var(--ui-pill-fg);border-color:var(--ui-pill)}
#bar button:focus-visible,#bar label.btn:focus-within,#bar input:focus-visible{outline:2px solid var(--ui-on);outline-offset:2px}
#vname{font-weight:600;min-width:0;flex:1;text-align:center}
#vdesc{color:var(--ui-dim);font-size:12px;line-height:1.45}
#bar .arrow{width:34px;padding:3px 0}
#strv{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;min-width:3.5em}
#badge{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ui-pill);color:var(--ui-pill-fg);padding:4px 12px;border-radius:999px;font-size:12px;z-index:6}
@media (max-width:560px){.win{grid-template-columns:96px minmax(0,1fr)}#stage{padding-bottom:440px}}
.side .hov{background:var(--raisedc)}
.side .inp{margin:0 10px 8px;padding:2px 8px;border:1px solid var(--linec);border-radius:5px;background:var(--raisedc);font-family:var(--sans);font-size:11.5px}
.ed .pop{display:block;width:max-content;max-width:100%;padding:3px 0;margin:2px 0 4px 120px;box-sizing:border-box}
.ed .pop div{padding:1px 10px;white-space:pre}
.wy{background:var(--washy)}
.wa2{background:var(--washa2)}
</style>

const lin=c=>c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4);

const cr=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const over=(t,a,bg)=>bg.map((v,i)=>t[i]*a+v*(1-a));
function filt(c,r){c=c.map(v=>cl((v-.5)*r.con+.5));c=c.map(v=>cl(v*r.bri));const s=r.sat,[R,G,B]=c;
  return [cl((.213+.787*s)*R+(.715-.715*s)*G+(.072-.072*s)*B),cl((.213-.213*s)*R+(.715+.285*s)*G+(.072-.072*s)*B),cl((.213-.213*s)*R+(.715-.715*s)*G+(.072+.928*s)*B)]}
const WORST=["#000000","#ffffff","#ff0000","#00ff00","#0000ff","#00ffff","#ff00ff","#ffff00"];

// ---- state ----
const st={c:0,mode:"flat",wall:"fill",hold:false,ro:true};
function pal(v){const c=CANDS[st.hold?0:st.c][v],o={...BASE[v],...c};o.accent=o.blue;return o}
// What the panel can turn into: flat value, or glass over every worst-case backdrop.
function panels(v,p,mode){const g=GLASS[v].panel,t=hx(p.tint);
  if(mode==="flat")return [hx(p.panel)];
  return WORST.map(b=>mode==="glass"?over(t,g.a,filt(hx(b),g)):over(t,g.op,hx(b)))}
const raisedOn=(p,bg,mode)=>mode==="flat"?hx(p.raised):over(hx(p.rg[0]),p.rg[1],bg);

function winHTML(v){
  return `<div class="cell" data-cell="${v}"><div class="wtitle">${NAME[v]}</div>
  <div class="win" data-v="${v}">
    <div class="surf top" data-s="chrome"><span class="dots"><i></i><i></i><i></i></span><span class="tab on">users.ts</span><span class="tab hovt">net.ts</span><span class="tab">README.md</span></div>
    <div class="surf side" data-s="chrome"><div class="inp">Search files</div><div>src</div><div class="hov">&nbsp; net.ts</div><div class="sel">&nbsp; users.ts</div><div>&nbsp; types.ts</div><div>tests</div><div>package.json</div><div>README.md</div></div>

// ---- backdrops ----
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function canvasWall(kind){
  const W=1600,H=1000,cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d"),r=rng(kind==="busy"?7:23);
  if(kind==="busy"){
    for(let i=0;i<220;i++){g.fillStyle=`hsl(${r()*360},100%,${35+r()*30}%)`;const x=r()*W,y=r()*H,s=20+r()*220;
      if(r()<.5){g.beginPath();g.arc(x,y,s/2,0,7);g.fill()}else g.fillRect(x,y,s,s*(.2+r()))}
  }else{
    const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,"#05070f");gr.addColorStop(.7,"#14213d");gr.addColorStop(1,"#3b2a4a");g.fillStyle=gr;g.fillRect(0,0,W,H);
    const rg=g.createRadialGradient(W*.7,H*.95,10,W*.7,H*.95,500);rg.addColorStop(0,"rgba(255,170,110,.55)");rg.addColorStop(1,"rgba(255,170,110,0)");g.fillStyle=rg;g.fillRect(0,0,W,H);
    g.fillStyle="#fff";for(let i=0;i<400;i++){g.globalAlpha=.3+r()*.7;g.fillRect(r()*W,r()*H*.7,1.5,1.5)}g.globalAlpha=1;
  }
  return cv.toDataURL("image/png")}
const WALLCSS={sands:`url(${SANDS})`,black:"#000",white:"#fff"};
let custom=null;
function wallCSS(k){if(k==="custom"&&custom)return `url(${custom})`;if(!WALLCSS[k])WALLCSS[k]=`url(${canvasWall(k)})`;return WALLCSS[k]}

function readHash(){const p=location.hash.slice(1).split("-");const ci=CANDS.findIndex(c=>c.key===p[0]);if(ci>=0)st.c=ci;
  if(MODES.some(x=>x.key===p[1]))st.mode=p[1];if(WALLS.some(x=>x.key===p[2]))st.wall=p[2]}
function writeHash(){try{history.replaceState(null,"","#"+[CANDS[st.c].key,st.mode,st.wall==="custom"?"fill":st.wall].join("-"))}catch(e){}}
const rgba=(h,a)=>`rgba(${hx(h).map(v=>Math.round(v*255))},${a})`;
function chip(label,x,floor,sw){const bad=floor&&x<floor;return `<span class="chip${bad?" bad":""}">${sw?`<i class="sw" style="background:${sw}"></i>`:""}${label} ${x.toFixed(2)}${bad?" fails":""}</span>`}
const minC=(fg,bgs)=>Math.min(...bgs.map(b=>cr(hx(fg),b)));
const WASHED=["accent","red","green","yellow"];
function readout(v,p){
  const mode=st.mode,pb=panels(v,p,mode),where=mode==="flat"?"flat":"worst case";
  const pn=hx(p.panel),rf=hx(p.raised),ln=hx(p.line);
  const dir=lum(rf)>=lum(pn)?"above":"below";
  // depth, measured on the flat values (how far apart things look), not a floor
  const depth=[chip(`raised ${dir} page`,cr(rf,pn),0,p.raised),chip("line on page",cr(ln,pn),0,p.line),chip("line on raised",cr(ln,rf),0),
    chip("raised on chrome",cr(rf,hx(p.chrome)),0),...WASHED.map(r=>chip(`${r} wash on page`,cr(over(hx(p[r]),p.wash,pn),pn),0,p[r]))].join("");
  // floors on every wash over the panel, and the accent wash over raised (popup selection)
  const wb=WASHED.flatMap(r=>pb.map(b=>over(hx(p[r]),p.wash,b)));
  const rb=pb.map(b=>raisedOn(p,b,mode)),rwb=rb.map(b=>over(hx(p.accent),p.wash,b));
  const fl=r=>r==="text"||r==="text_dim"?4.5:3;
  return `<div class="row"><b>Values</b><span class="chip"><i class="sw" style="background:${p.raised}"></i>raised_flat ${p.raised}</span><span class="chip"><i class="sw" style="background:${rgba(p.rg[0],p.rg[1])}"></i>raised ${p.rg[0]} at ${p.rg[1]}</span><span class="chip"><i class="sw" style="background:${p.line}"></i>line ${p.line}</span><span class="chip">wash ${p.wash}</span></div>
    <div class="row"><b>How far apart (flat)</b>${depth}</div>
    <div class="row"><b>On any wash, ${where}</b>${[...TXT,...COLS].map(r=>chip(r.replace("text_",""),minC(p[r],wb),fl(r),p[r])).join("")}</div>
    <div class="row"><b>On raised, ${where}</b>${[...TXT,...COLS].map(r=>chip(r.replace("text_",""),minC(p[r],rb),r==="text_muted"?3:4.5,p[r])).join("")}</div>
    <div class="row"><b>Accent wash on raised</b>${[...TXT,...COLS].map(r=>chip(r.replace("text_",""),minC(p[r],rwb),fl(r),p[r])).join("")}</div>`}

function render(){
  const stage=document.getElementById("stage");
  stage.style.background=st.wall==="fill"?"var(--ui-bg)":`${wallCSS(st.wall)} center/cover no-repeat`;
  for(const w of document.querySelectorAll(".win")){const v=w.dataset.v,p=pal(v),cell=w.parentElement;
    cell.classList.toggle("fill",st.wall==="fill");cell.style.background=st.wall==="fill"?p.backdrop:"";
    for(const k in p)if(typeof p[k]==="string"){w.style.setProperty("--"+k,p[k]);cell.style.setProperty("--"+k,p[k])}
    const glassy=st.mode!=="flat";
    w.style.setProperty("--linec",p.line);
    w.style.setProperty("--raisedc",glassy?rgba(p.rg[0],p.rg[1]):p.raised);
    const wsh=r=>glassy?rgba(p[r],p.wash):toHex(over(hx(p[r]),p.wash,hx(p.panel)));
    w.style.setProperty("--washc",wsh("accent"));w.style.setProperty("--washr",wsh("red"));w.style.setProperty("--washg",wsh("green"));w.style.setProperty("--washy",wsh("yellow"));
    w.style.setProperty("--washa2",glassy?rgba(p.accent,p.wash):toHex(over(hx(p.accent),p.wash,hx(p.raised))));
    w.style.setProperty("--panelc",glassy?rgba(p.rg[0],p.rg[1]):p.panel);
    for(const el of w.querySelectorAll(".surf")){const g=GLASS[v][el.dataset.s];
      if(st.mode==="glass"){const f=`blur(${g.blur}px) contrast(${g.con}) brightness(${g.bri}) saturate(${g.sat})`;el.style.background=rgba(p.tint,g.a);el.style.backdropFilter=f;el.style.webkitBackdropFilter=f}
      else if(st.mode==="op"){el.style.background=rgba(p.tint,g.op);el.style.backdropFilter="none";el.style.webkitBackdropFilter="none"}
      else{el.style.background=p[el.dataset.s];el.style.backdropFilter="none";el.style.webkitBackdropFilter="none"}}}
  for(const el of document.querySelectorAll(".ro")){const v=el.dataset.ro;el.hidden=!st.ro;if(st.ro)el.innerHTML=readout(v,pal(v))}
  const c=CANDS[st.hold?0:st.c];
  document.getElementById("vname").textContent=(st.hold?"Today (held)":c.name)+`  ${st.c+1}/${CANDS.length}`;
  document.getElementById("vdesc").textContent=c.desc;
  const b=document.getElementById("badge");b.hidden=!st.hold;b.textContent="Showing today's raised, line and wash";
  for(const [id,key] of [["modes","mode"],["walls","wall"]])
    for(const x of document.querySelectorAll(`#${id} button`))x.setAttribute("aria-pressed",x.dataset.k===st[key]);
  document.getElementById("ro").setAttribute("aria-pressed",st.ro);
  writeHash()}
function group(id,list,key){const el=document.getElementById(id);el.innerHTML=list.map(x=>`<button data-k="${x.key}">${x.name}</button>`).join("");
  el.addEventListener("click",e=>{const b=e.target.closest("button");if(b){st[key]=b.dataset.k;render()}})}
group("modes",MODES,"mode");group("walls",WALLS,"wall");
const step=d=>{st.c=(st.c+d+CANDS.length)%CANDS.length;render()};
document.getElementById("prev").onclick=()=>step(-1);document.getElementById("next").onclick=()=>step(1);
document.getElementById("ro").onclick=()=>{st.ro=!st.ro;render()};
const holdEl=document.getElementById("hold"),setHold=h=>{if(st.hold!==h){st.hold=h;render()}};
holdEl.addEventListener("pointerdown",()=>setHold(true));for(const ev of["pointerup","pointerleave","pointercancel"])holdEl.addEventListener(ev,()=>setHold(false));
addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,textarea,[contenteditable]"))return;
  if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1);else if(e.key===" "){e.preventDefault();setHold(true)}});
addEventListener("keyup",e=>{if(e.key===" ")setHold(false)});
document.getElementById("file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;custom=URL.createObjectURL(f);st.wall="custom";render()});
addEventListener("hashchange",()=>{readHash();render()});
readHash();render();
</script>
